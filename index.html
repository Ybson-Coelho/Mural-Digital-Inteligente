<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela 1 - Escolha de Acesso</title>
    <link rel="stylesheet" href="../Mural-Digital-Inteligente/src/css/global.css">
    <link rel="stylesheet" href="../Mural-Digital-Inteligente/src/css/index.css">
</head>
<body>
    <div class="access-screen">
        <!-- Logo IFTO Oficial -->
        <header class="logo-ifto">
            <div class="grid-if">
                <div class="block red-circle"></div>
                <div class="block green"></div>
                <div class="block green"></div>
                <div class="block green"></div>
                <div class="block green"></div>
                <div class="block green"></div>
                <div class="block green"></div>
                <div class="block green"></div>
                <div class="block green"></div>
            </div>
            <div class="logo-text">
                <span class="bold">INSTITUTO FEDERAL</span>
                <span class="sub">Tocantins</span>
            </div>
        </header>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <h1 class="title">Mural Digital IFTO</h1>
            <p class="subtitle">
                Informação, eventos e novidades do nosso campus,<br>
                sempre ao seu alcance.
            </p>

            <h2 class="question">Como você deseja acessar?</h2>

            <div class="cards-container">
                <!-- Card Visitante -->
                <a href="../Mural-Digital-Inteligente/src/pages/mural.html" class="card card-visitor">
                    <div class="icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                    </div>
                    <span class="card-title">VISITANTE</span>
                    <p class="card-desc">Acesse o mural sem precisar de login.</p>
                    <span class="arrow">&rarr;</span>
                </a>

                <!-- Card Administrador -->
                <a href="../tela-4/index.html" class="card card-admin">
                    <div class="icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                    </div>
                    <span class="card-title">ADMINISTRADOR</span>
                    <p class="card-desc">Faça login para gerenciar o conteúdo.</p>
                    <span class="arrow">&rarr;</span>
                </a>
            </div>
        </main>

        <!-- Rodapé -->
        <footer class="footer">
            IFTO - Instituto Federal do Tocantins
        </footer>
    </div>
</body>
</html>
