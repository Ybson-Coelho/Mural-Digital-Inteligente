<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela 6 - Adicionar Evento</title>
    <link rel="stylesheet" href="../css/evento.css">
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Topbar / Cabeçalho Superior -->
        <header class="topbar">
            <div class="logo-ifto">
                <div class="grid-if">
                    <div class="block red-circle"></div>
                    <div class="block green"></div>
                    <div class="block green"></div>
                    <div class="block green"></div>
                    <div class="block green"></div>
                    <div class="block green"></div>
                    <div class="block green"></div>
                    <div class="block green"></div>
                    <div class="block green"></div>
                </div>
                <div class="logo-text">
                    <span class="bold">INSTITUTO FEDERAL</span>
                    <span class="sub">Tocantins</span>
                </div>
            </div>

            <div class="user-profile">
                <div class="avatar-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <span>admin &blacktriangledown;</span>
            </div>
        </header>

        <div class="main-wrapper">
            <!-- Sidebar / Menu Lateral -->
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <a href="#" class="nav-item">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                        Início
                    </a>
                    <a href="#" class="nav-item active">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10z"/></svg>
                        Publicações &blacktriangledown;
                    </a>
                    <a href="#" class="sub-item active">&bull; Eventos</a>
                    <a href="#" class="sub-item">&bull; Notícias</a>
                    <a href="#" class="sub-item">&bull; Vídeos</a>
                    <a href="#" class="nav-item">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>
                        Relatórios
                    </a>
                    <a href="#" class="nav-item">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                        Configurações
                    </a>
                </nav>

                <a href="#" class="btn-logout">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
                    Sair
                </a>
            </aside>

            <!-- Área de Conteúdo da Tela 6 -->
            <main class="content-area">
                <div class="form-container">
                    <!-- Cabeçalho do Card -->
                    <div class="form-header">
                        <div class="header-icon">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10z"/></svg>
                        </div>
                        <div>
                            <h2>Adicionar Evento</h2>
                            <p>Preencha as informações do evento.</p>
                        </div>
                    </div>

                    <form class="event-form">
                        <!-- Título do Evento -->
                        <div class="form-group">
                            <label>Título do evento *</label>
                            <input type="text" placeholder="Semana de Ciência e Tecnologia">
                        </div>

                        <!-- Nome do Evento -->
                        <div class="form-group">
                            <label>Nome do evento *</label>
                            <input type="text" placeholder="Ex.: Semana de Ciência e Tecnologia do IFTO">
                        </div>

                        <!-- Data do Evento -->
                        <div class="form-group">
                            <label>Data do evento *</label>
                            <div class="input-with-icon">
                                <input type="date" placeholder="2025-10-20">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="#64748b"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10z"/></svg>
                            </div>
                        </div>

                        <!-- Imagem do Evento (Com foto 5) -->
                        <div class="form-group">
                            <label>Imagem do evento</label>
                            <div class="image-upload-wrapper">
                                <div class="image-preview">
                                    <img src="../assets/images/evento.img.svg" alt="Preview da imagem">
                                    <div class="preview-overlay">
                                        <span>SEMANA</span>
                                        <strong>C&T</strong>
                                    </div>
                                </div>
                                <div class="upload-actions">
                                    <button type="button" class="btn-outline">Trocar imagem</button>
                                    <button type="button" class="btn-ia">
                                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2L9.19 8.63 2 12l7.19 3.37L12 22l2.81-6.63L22 12l-7.19-3.37z"/></svg>
                                        Gerar imagem com IA
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Descrição -->
                        <div class="form-group">
                            <label>Descrição *</label>
                            <textarea rows="3" placeholder="Evento acontecerá entre os dias 20 e 24 de outubro, com palestras, mesas redondas e apresentações de trabalhos."></textarea>
                        </div>

                        <!-- Categoria -->
                        <div class="form-group">
                            <label>Categoria *</label>
                            <select>
                                <option>Selecione uma categoria</option>
                                <option selected>Evento</option>
                                <option>Notícia</option>
                                <option>Vídeo</option>
                            </select>
                        </div>

                        <!-- Ações do Formulário -->
                        <div class="form-actions">
                            <button type="submit" class="btn-submit">Publicar evento</button>
                            <button type="button" class="btn-cancel">Cancelar</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
