<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../components/header/header.css" />
    <link rel="stylesheet" href="../components/sidebar/sidebar.css" />

    <link rel="stylesheet" href="../css/gerenciar-publicacoes.css" />

    <title>Gerenciar Publicações</title>
  </head>

  <body>
    <div id="header"></div>

    <div id="sidebar"></div>

    <main>
      <div class="page-header">
        <h1>Lista de Publicações</h1>

        <button class="btn btn-primary" id="btn-nova-publicacao">
          <i data-lucide="plus"></i>
          Nova Publicação
        </button>
      </div>

      <div class="page-search">
        <div class="search-container">
          <input
            type="text"
            id="search"
            name="search"
            placeholder="Buscar publicação..."
          />
          <button class="btn btn-primary" id="btn-search">
            <i data-lucide="search"></i>
          </button>
        </div>

        <select id="type" name="type">
          <option value="all" selected>Todos os Tipos</option>
          <option value="noticia">Notícia</option>
          <option value="evento">Evento</option>
          <option value="artigo">Artigo</option>
        </select>
      </div>

      <div class="publicacoes-container" id="publicacoes-container">
        <div class="publicacoes-header">
          <span>Título</span>
          <span>Tipo</span>
          <span>Data</span>
          <span>Ações</span>
        </div>

        <div class="publicacoes-list" id="publicacoes-list"></div>
      </div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/main.js"></script>
    <script src="../js/gerenciar-publicacoes.js"></script>
  </body>
</html>
