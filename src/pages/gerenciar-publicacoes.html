<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../components/header/header.css" />
    <link rel="stylesheet" href="../components/sidebar/sidebar.css" />
    <link rel="stylesheet" href="../css/gerenciar-publicacoes.css" />

    <title>Gerenciar Publicações - Mural Digital IFTO</title>
  </head>

  <body>
    <div id="header"></div>
    <div id="sidebar"></div>

    <main class="admin-main">
      <div class="page-header">
        <h1>Lista de Publicações</h1>

        <a href="criar-publicacao.html" class="btn btn-primary">
          <i data-lucide="plus"></i>
          Nova Publicação
        </a>
      </div>

      <div class="page-search">
        <div class="search-container">
          <input
            type="text"
            id="search"
            placeholder="Buscar publicação..."
            aria-label="Buscar publicação"
          />
          <button
            class="btn btn-primary"
            id="btn-search"
            type="button"
            aria-label="Buscar"
          >
            <i data-lucide="search"></i>
          </button>
        </div>

        <select id="type" aria-label="Filtrar por tipo de publicação">
          <option value="0" selected>Todos os Tipos</option>
          <option value="1">Notícia</option>
          <option value="2">Evento</option>
          <option value="3">Vídeo</option>
        </select>
      </div>

      <section
        class="publicacoes-container"
        id="publicacoes-container"
        aria-label="Tabela de publicações"
      >
        <div class="publicacoes-header" role="row">
          <span>Título</span>
          <span>Tipo</span>
          <span>Data</span>
          <span>Ações</span>
        </div>

        <div class="publicacoes-list" id="publicacoes-list"></div>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/main.js"></script>
    <script src="../js/gerenciar-publicacoes.js"></script>
  </body>
</html>
