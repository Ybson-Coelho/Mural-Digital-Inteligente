<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Administrador - IFTO</title>
  <link rel="stylesheet" href="../css/painel.css">
  <script src="../js/painel.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../assets/images/Logo-IFTO.png" alt="Logo IFTO" class="logo-sidebar">
        <div class="text-logo_I">
          <h3>Instituição Federal</h3>
          <h4>Tocantins</h4>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" id="nav-inicio">
          <i class="fa-solid fa-house"></i> Início
        </a>

        <div class="nav-dropdown">
          <a href="#" class="nav-item nav-dropdown-toggle" id="btn-publicacoes">
            <i class="fa-solid fa-newspaper"></i> Publicações
            <i class="fa-solid fa-chevron-right arrow"></i>
          </a>

          <div class="submenu" id="submenu-publicacoes">
            <a href="#" class="submenu-item"><i class="fa-solid fa-bullhorn"></i> Notícias</a>
            <a href="#" class="submenu-item"><i class="fa-solid fa-calendar-days"></i> Eventos</a>
            <a href="#" class="submenu-item"><i class="fa-solid fa-video"></i> Vídeos</a>
          </div>
        </div>

        <a href="#" class="nav-item"><i class="fa-solid fa-chart-line"></i> Relatórios</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-gear"></i> Configurações</a>
      </nav>

      <div class="sidebar-footer">
        <a href="login.html" class="nav-item logout"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="user-profile" id="user-profile-btn">
          <i class="fa-solid fa-circle-user"></i>
          <span>admin</span>
          <i class="fa-solid fa-chevron-right arrow-user"></i>
        </div>
      </header>

      <section class="content-area">
        <h1>Painel Administrativo</h1>

        <div class="cards-grid">
          <div class="card">
            <div class="card-icon green-bg"><i class="fa-solid fa-newspaper"></i></div>
            <div class="card-info">
              <small>Total de publicações</small>
              <h2 id="total-publicacoes">0</h2>
            </div>
          </div>

          <div class="card">
            <div class="card-icon blue-bg"><i class="fa-solid fa-bullhorn"></i></div>
            <div class="card-info">
              <small>Notícias</small>
              <h2 id="total-noticias">0</h2>
            </div>
          </div>

          <div class="card">
            <div class="card-icon green-light-bg"><i class="fa-solid fa-calendar-days"></i></div>
            <div class="card-info">
              <small>Eventos</small>
              <h2 id="total-eventos">0</h2>
            </div>
          </div>

          <div class="card">
            <div class="card-icon purple-bg"><i class="fa-solid fa-video"></i></div>
            <div class="card-info">
              <small>Vídeos</small>
              <h2 id="total-videos">0</h2>
            </div>
          </div>
        </div>

        <div class="table-container">
          <h3>Últimas publicações</h3>
          
          <table id="tabela-publicacoes">
            <thead>
              <tr>
                <th>Título</th>
                <th>Tipo</th>
                <th>Data</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>

              <tr id="empty-row">
                <td colspan="4" class="empty-message">Nenhuma publicação cadastrada até o momento.</td>
              </tr>
            </tbody>
          </table>

          <button class="btn-new" id="btn-nova-publicacao">
            <i class="fa-solid fa-plus"></i> Nova Publicação
          </button>
        </div>

      </section>
    </main>

  </div>
</body>
</html>
