<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuários - IFTO</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/acessos.css">
  <link rel="stylesheet" href="../css/global.css">
</head>
<body>

  <div class="card-container">
    <div class="header">
      <div class="logo-container">
        <div class="if-symbol">
          <div class="if-col">
            <div class="red-circle"></div>
            <div class="green-square"></div>
            <div class="green-square"></div>
            <div class="green-square"></div>
          </div>
          <div class="if-col">
            <div class="green-square"></div>
            <div class="green-square"></div>
            <div class="green-square"></div>
            <div class="green-square"></div>
          </div>
          <div class="if-col">
            <div class="green-square"></div>
            <div class="empty-space"></div>
            <div class="green-square"></div>
            <div class="empty-space"></div>
          </div>
        </div>

        <div class="brand-text">
          <span class="title">INSTITUTO FEDERAL</span>
          <span class="subtitle">Tocantins</span>
        </div>
      </div>
      <h2>Cadastro de Novo Usuário</h2>
      <p>Preencha os dados abaixo para cadastrar e conceder permissões.</p>
    </div>

    <form id="userForm">
      <div class="form-group">
        <label for="name">Nome Completo</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user icon"></i>
          <input type="text" id="name" placeholder="Ex: João da Silva" required>
        </div>
      </div>

      <div class="form-group">
        <label for="registration">Matrícula</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-id-card icon"></i>
          <input type="text" id="registration" placeholder="Ex: 202310110001" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Senha Inicial</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock icon"></i>
          <input type="password" id="password" placeholder="Digite a senha de acesso" required>
          <button type="button" class="btn-toggle-pass" id="togglePasswordBtn">
            <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label>Permissões do Usuário</label>
        
        <div class="permissions-grid">
          <label class="checkbox-item">
            <input type="checkbox" name="permissions" value="postagems">
            <span>Criar / Editar Postagens</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="permissions" value="usuarios">
            <span>Gerenciar Usuários</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="permissions" value="configuracoes">
            <span>Acessar Configurações</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="permissions" value="relatorios">
            <span>Visualizar Relatórios</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="permissions" value="exclusao">
            <span>Permissão para Excluir Dados</span>
          </label>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <i class="fa-solid fa-user-plus"></i> Cadastrar Usuário
      </button>

      <a href="#" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Voltar para o início
      </a>
    </form>

    <div class="footer-section">
      <div class="waves-container">
        <svg viewBox="0 0 500 150" preserveAspectRatio="none">
          <path d="M0.00,49.98 C150.00,150.00 349.20,-49.98 500.00,49.98 L500.00,150.00 L0.00,150.00 Z" class="wave-bg"></path>
          <path d="M0.00,80.00 C200.00,130.00 300.00,40.00 500.00,90.00 L500.00,150.00 L0.00,150.00 Z" class="wave-fg"></path>
        </svg>
      </div>
      <div class="footer-text">
        IFTO - Mural Digital
      </div>
    </div>
  </div>

  <script src="../js/acessos.js"></script>
</body>
</html>
