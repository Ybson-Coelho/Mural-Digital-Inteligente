<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Login do Administrador</title>
</head>
<body>

    <div class="logo_I">
        <img src="../assets/images/Logo-IFTO.png" alt="Logo">
        <hgroup class="text-logo_I">
            <h3>Instituição Federal</h3>
            <h4>Tocantins</h4>
        </hgroup>
    </div>

    <h1>Acesso do Administrador</h1>
    <legend>Digite suas credenciais para continuar.</legend>

    <form>
        <div class="input-group">
            <i class="fa-solid fa-user icon-left"></i>
            <input type="text" id="usuario_administrador" name="usuario_administrador" placeholder="Usuário">
        </div>

        <div class="input-group">
            <i class="fa-solid fa-lock icon-left"></i>
            <input type="password" id="senha_administrador" name="senha_administrador" placeholder="Senha">
            <i class="fa-solid fa-eye icon-right" id="toggleSenha"></i>
        </div>

        <button type="submit" class="Entrar">Entrar</button>
    </form>

    <a href="#" class="Voltar">Voltar para o Inicio</a>

    <script>
        const toggleSenha = document.getElementById('toggleSenha');
        const senhaInput = document.getElementById('senha_administrador');

        toggleSenha.addEventListener('click', function () {
            const type = senhaInput.getAttribute('type') === 'password' ? 'text' : 'password';
            senhaInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>
