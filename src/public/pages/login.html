<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/login.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <title>Login do Administrador</title>
  </head>

  <body>
    <div class="logo_I">
      <img src="/assets/images/Logo-IFTO.png" alt="Logo IFTO" />

      <hgroup class="text-logo_I">
        <h3>Instituição Federal</h3>
        <h4>Tocantins</h4>
      </hgroup>
    </div>

    <h1>Acesso do Administrador</h1>

    <legend>Digite suas credenciais para continuar.</legend>

    <form id="form-login">
      <div class="input-group">
        <i class="fa-solid fa-envelope icon-left"></i>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="E-mail"
          required
        />
      </div>

      <div class="input-group">
        <i class="fa-solid fa-id-card icon-left"></i>

        <input
          type="text"
          id="matricula"
          name="matricula"
          placeholder="Matrícula"
          required
        />
      </div>

      <div class="input-group">
        <i class="fa-solid fa-lock icon-left"></i>

        <input
          type="password"
          id="senha"
          name="senha"
          placeholder="Senha"
          required
        />

        <i
          class="fa-solid fa-eye icon-right"
          id="toggleSenha"
          role="button"
          tabindex="0"
          aria-label="Mostrar senha"
        ></i>
      </div>

      <p id="mensagem-login" role="alert"></p>

      <button type="submit" class="Entrar" id="btn-entrar">Entrar</button>
    </form>

    <a href="/" class="Voltar">Voltar para o Início</a>

    <footer class="rodape">
      <svg viewBox="0 0 1440 320" preserveAspectRatio="none" class="svg-ondas">

          fill-opacity="0.3"

        ></path>

        <path

        <path

      <div class="texto-rodape">IFTO - Mural Digital</div>
    </footer>

    <script src="/js/login.js"></script>
  </body>
</html>
