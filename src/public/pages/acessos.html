
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuários - IFTO</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/acessos.css">
</head>
<body>
    <div class="card-container">
        <div class="header">
            <div class="logo-container">
                <div class="if-symbol">
                    <div class="if-col">
                        <div class="red-circle"></div>
                        <div class="green-square"></div>
                        <div class="green-square"></div>
                        <div class="green-square"></div>
                    </div>
                    <div class="if-col">
                        <div class="green-square"></div>
                        <div class="green-square"></div>
                        <div class="green-square"></div>
                        <div class="green-square"></div>
                    </div>
                    <div class="if-col">
                        <div class="green-square"></div>
                        <div class="empty-space"></div>
                        <div class="green-square"></div>
                        <div class="empty-space"></div>
                    </div>
                </div>

                <div class="brand-text">
                    <span class="title">INSTITUTO FEDERAL</span>
                    <span class="subtitle">Tocantins</span>
                </div>
            </div>

            <h2>Cadastro de Novo Usuário</h2>
            <p>Preencha os dados abaixo para cadastrar e conceder permissões.</p>
        </div>

        <form id="userForm">
            <div class="form-group">
                <label for="name">Nome Completo</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user icon"></i>
                    <input
                        type="text"
                        id="name"
                        name="nome"
                        placeholder="Ex: João da Silva"
                        minlength="2"
                        maxlength="250"
                        autocomplete="name"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope icon"></i>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Ex: nome@estudante.ifto.edu.br"
                        maxlength="250"
                        autocomplete="email"
                        pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$"
                        title="Informe um e-mail válido"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="registration">Matrícula</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-id-card icon"></i>
                    <input
                        type="text"
                        id="registration"
                        name="matricula"
                        placeholder="Ex: 202310110001"
                        maxlength="100"
                        autocomplete="off"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Senha Inicial</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock icon"></i>
                    <input
                        type="password"
                        id="password"
                        name="senha"
                        placeholder="Digite a senha de acesso"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                    <button
                        type="button"
                        class="btn-toggle-pass"
                        id="togglePasswordBtn"
                        aria-label="Mostrar senha"
                    >
                        <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
                <small>A senha deve ter pelo menos 8 caracteres.</small>
            </div>

            <div class="form-group">
                <label>Permissões de acesso</label>
                <div class="permissions-grid">
                    <label class="checkbox-item">
                        <input type="checkbox" name="permissions" value="gerenciar_publicacoes">
                        <span>Criar e gerenciar publicações</span>
                    </label>

                    <label class="checkbox-item">
                        <input type="checkbox" name="permissions" value="gerenciar_usuarios">
                        <span>Gerenciar usuários</span>
                    </label>

                    <label class="checkbox-item">
                        <input type="checkbox" name="permissions" value="acessar_configuracoes">
                        <span>Acessar configurações</span>
                    </label>

                    <label class="checkbox-item">
                        <input type="checkbox" name="permissions" value="visualizar_relatorios">
                        <span>Visualizar relatórios</span>
                    </label>

                    <label class="checkbox-item">
                        <input type="checkbox" name="permissions" value="excluir_dados">
                        <span>Excluir dados</span>
                    </label>

                    <label class="checkbox-item">
                        <input type="checkbox" name="permissions" value="gerenciar_noticias">
                        <span>Gerenciar notícias</span>
                    </label>

                    <label class="checkbox-item">
                        <input type="checkbox" name="permissions" value="gerenciar_eventos">
                        <span>Gerenciar eventos</span>
                    </label>

                    <label class="checkbox-item">
                        <input type="checkbox" name="permissions" value="gerenciar_videos">
                        <span>Gerenciar vídeos</span>
                    </label>

                    <label class="checkbox-item">
                        <input type="checkbox" name="permissions" value="visualizar_painel">
                        <span>Acessar o painel</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-user-plus"></i> Cadastrar Usuário
            </button>

            <a href="../index.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Voltar para o início
            </a>
        </form>

        <div class="footer-section">
            <div class="waves-container">
                <svg viewBox="0 0 500 150" preserveAspectRatio="none" aria-hidden="true">
                    <path d="M0.00,49.98 C150.00,150.00 349.20,-49.98 500.00,49.98 L500.00,150.00 L0.00,150.00 Z" class="wave-bg"></path>
                    <path d="M0.00,80.00 C200.00,130.00 300.00,40.00 500.00,90.00 L500.00,150.00 L0.00,150.00 Z" class="wave-fg"></path>
                </svg>
            </div>

            <div class="footer-text">
                IFTO - Mural Digital
            </div>
        </div>
    </div>

    <script src="../js/proteger-admin.js"></script>
    <script src="../js/acessos.js"></script>
</body>
</html>
