<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciar Publicações | Mural Digital IFTO</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/toast.css" />
    <link rel="stylesheet" href="../css/cadeado.css" />
    <link rel="stylesheet" href="../components/header/header.css" />
    <link rel="stylesheet" href="../components/sidebar/sidebar.css" />
    <link rel="stylesheet" href="../css/gerenciar-publicacoes.css" />
  </head>

  <body>
    <div id="header"></div>
    <div id="sidebar"></div>

    <main class="admin-main">
      <div class="page-header">
        <h1>Lista de Publicações</h1>

        <button type="button" class="btn btn-primary" id="btn-nova-publicacao">
          <i data-lucide="plus"></i>
          Nova Publicação
        </button>
      </div>

      <div class="page-search">
        <div class="search-container">
          <input
            type="text"
            id="search"
            placeholder="Buscar publicação..."
            aria-label="Buscar publicação"
          />
          <button
            class="btn btn-primary"
            id="btn-search"
            type="button"
            aria-label="Buscar"
          >
            <i data-lucide="search"></i>
          </button>
        </div>

        <select id="type" aria-label="Filtrar por tipo de publicação">
          <option value="0" selected>Todos os Tipos</option>
          <option value="1">Notícia</option>
          <option value="2">Evento</option>
          <option value="3">Vídeo</option>
        </select>
      </div>

      <section
        class="publicacoes-container"
        id="publicacoes-container"
        aria-label="Tabela de publicações"
      >
        <div class="publicacoes-header" role="row">
          <span>Título</span>
          <span>Tipo</span>
          <span>Data</span>
          <span>Ações</span>
        </div>

        <div class="publicacoes-list" id="publicacoes-list"></div>
      </section>
    </main>

    <div class="modal" id="modal-publicacao" hidden>
      <div
        class="modal-conteudo"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-publicacao-titulo"
      >
        <div class="modal-cabecalho">
          <h2 id="modal-publicacao-titulo">Nova publicação</h2>

          <button
            type="button"
            class="modal-fechar"
            id="btn-fechar-modal"
            aria-label="Fechar"
          >
            <i data-lucide="x"></i>
          </button>
        </div>

        <form id="form-publicacao">
          <div class="modal-corpo">
            <p class="modal-tipo" id="modal-publicacao-tipo" hidden></p>

            <div class="form-group" id="grupo-tipo">
              <label for="tipo">Tipo de Publicação</label>
              <select id="tipo" name="tipo" required>
                <option value="" disabled selected>Selecione o tipo</option>
                <option value="1">Notícia</option>
                <option value="2">Evento</option>
                <option value="3">Vídeo</option>
              </select>
            </div>

            <div class="form-group">
              <label for="titulo">Título da Publicação</label>
              <input
                type="text"
                id="titulo"
                name="titulo"
                placeholder="Digite o título da publicação"
                maxlength="250"
                required
              />
            </div>

            <div class="modal-duas-colunas">
              <div class="form-group">
                <label for="data-publicacao">Data da Publicação</label>
                <input
                  type="date"
                  id="data-publicacao"
                  name="data_publicacao"
                  required
                />
              </div>

              <div class="form-group">
                <label for="data-final">Data Final da Publicação</label>
                <input
                  type="date"
                  id="data-final"
                  name="data_final_publicacao"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label for="tempo-tela">Tempo de Tela (segundos)</label>
              <input
                type="number"
                id="tempo-tela"
                name="tempo_de_tela_publicacao"
                min="1"
                placeholder="Ex.: 15"
                required
              />
            </div>

            <fieldset class="campos-tipo" id="campos-noticia" hidden disabled>
              <div class="form-group">
                <label for="imagem-noticia">Imagem da Notícia (opcional)</label>
                <input
                  type="file"
                  id="imagem-noticia"
                  name="arquivo"
                  accept="image/jpeg,image/png,image/webp"
                  data-opcional="true"
                />
                <small>JPG, PNG ou WebP, até 5 MB.</small>
                <img
                  class="preview-imagem-edicao"
                  id="preview-noticia"
                  alt="Imagem da notícia"
                  hidden
                />
              </div>

              <div class="form-group">
                <label for="conteudo">Descrição da Notícia</label>

                <div
                  class="editor-toolbar"
                  role="toolbar"
                  aria-label="Ferramentas de formatação"
                >
                  <button
                    type="button"
                    data-comando="bold"
                    title="Negrito"
                    aria-label="Negrito"
                  >
                    <i data-lucide="bold"></i>
                  </button>

                  <button
                    type="button"
                    data-comando="italic"
                    title="Itálico"
                    aria-label="Itálico"
                  >
                    <i data-lucide="italic"></i>
                  </button>

                  <button
                    type="button"
                    data-comando="underline"
                    title="Sublinhado"
                    aria-label="Sublinhado"
                  >
                    <i data-lucide="underline"></i>
                  </button>

                  <button
                    type="button"
                    data-comando="insertUnorderedList"
                    title="Lista"
                    aria-label="Lista com marcadores"
                  >
                    <i data-lucide="list"></i>
                  </button>

                  <button
                    type="button"
                    data-comando="insertOrderedList"
                    title="Lista numerada"
                    aria-label="Lista numerada"
                  >
                    <i data-lucide="list-ordered"></i>
                  </button>
                </div>

                <div
                  id="conteudo"
                  class="editor-conteudo"
                  contenteditable="true"
                  role="textbox"
                  aria-multiline="true"
                  aria-label="Descrição da notícia"
                ></div>
              </div>
            </fieldset>

            <fieldset class="campos-tipo" id="campos-evento" hidden disabled>
              <div class="form-group">
                <label for="tipo-evento">Tipo do Evento</label>
                <input
                  type="text"
                  id="tipo-evento"
                  name="tipo_evento"
                  placeholder="Ex.: Palestra, Feira, Reunião"
                  required
                />
              </div>

              <div class="form-group">
                <label for="data-evento">Data do Evento</label>
                <input
                  type="date"
                  id="data-evento"
                  name="data_evento"
                  required
                />
              </div>

              <div class="form-group">
                <label for="poster-evento">Pôster do Evento (opcional)</label>
                <input
                  type="file"
                  id="poster-evento"
                  name="arquivo"
                  accept="image/jpeg,image/png,image/webp"
                  data-opcional="true"
                />
                <small>JPG, PNG ou WebP, até 5 MB.</small>
                <img
                  class="preview-imagem-edicao"
                  id="preview-evento"
                  alt="Pôster do evento"
                  hidden
                />
              </div>

              <div class="form-group">
                <label for="conteudo-evento">Descrição do Evento</label>

                <div
                  class="editor-toolbar"
                  role="toolbar"
                  aria-label="Ferramentas de formatação"
                >
                  <button
                    type="button"
                    data-comando="bold"
                    title="Negrito"
                    aria-label="Negrito"
                  >
                    <i data-lucide="bold"></i>
                  </button>

                  <button
                    type="button"
                    data-comando="italic"
                    title="Itálico"
                    aria-label="Itálico"
                  >
                    <i data-lucide="italic"></i>
                  </button>

                  <button
                    type="button"
                    data-comando="underline"
                    title="Sublinhado"
                    aria-label="Sublinhado"
                  >
                    <i data-lucide="underline"></i>
                  </button>

                  <button
                    type="button"
                    data-comando="insertUnorderedList"
                    title="Lista"
                    aria-label="Lista com marcadores"
                  >
                    <i data-lucide="list"></i>
                  </button>

                  <button
                    type="button"
                    data-comando="insertOrderedList"
                    title="Lista numerada"
                    aria-label="Lista numerada"
                  >
                    <i data-lucide="list-ordered"></i>
                  </button>
                </div>

                <div
                  id="conteudo-evento"
                  class="editor-conteudo"
                  contenteditable="true"
                  role="textbox"
                  aria-multiline="true"
                  aria-label="Descrição do evento"
                ></div>
              </div>

              <div class="form-group">
                <label for="publico-evento">Público do Evento</label>
                <input
                  type="text"
                  id="publico-evento"
                  name="publico_evento"
                  placeholder="Ex.: Alunos, Comunidade em geral"
                  required
                />
              </div>
            </fieldset>

            <fieldset class="campos-tipo" id="campos-video" hidden disabled>
              <div class="form-group">
                <label for="link-video">Link do YouTube</label>
                <input
                  type="url"
                  id="link-video"
                  name="link_video"
                  placeholder="Ex.: https://www.youtube.com/watch?v=..."
                  required
                />
              </div>

              <div class="form-group">
                <label for="imagem-video">Imagem de capa (opcional)</label>
                <input
                  type="file"
                  id="imagem-video"
                  name="arquivo"
                  accept="image/jpeg,image/png,image/webp"
                  data-opcional="true"
                />
                <small>JPG, PNG ou WebP, até 5 MB.</small>
                <img
                  class="preview-imagem-edicao"
                  id="preview-video"
                  alt="Capa do vídeo"
                  hidden
                />
              </div>
            </fieldset>

            <input type="hidden" id="categoria" value="Geral" />
          </div>

          <div class="modal-acoes">
            <button
              type="button"
              class="btn btn-secondary btn-cancelar"
              id="btn-cancelar-modal"
            >
              Cancelar
            </button>

            <button
              type="submit"
              class="btn btn-primary"
              id="btn-salvar-publicacao"
            >
              <i data-lucide="save"></i>
              Salvar
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/config.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/cadeado.js"></script>
    <script src="../js/proteger-admin.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/gerenciar-publicacoes.js"></script>
  </body>
</html>
