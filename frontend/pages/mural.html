<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/toast.css" />
    <link rel="stylesheet" href="../components/header/header.css" />
    <link rel="stylesheet" href="../css/mural.css" />

    <title>Mural Digital IFTO</title>
  </head>

  <body>
    <header class="header header--static">
      <a href="/index.html" class="header-logo">
        <img
          src="/assets/images/logo-ifto.png"
          alt="Instituto Federal do Tocantins"
        />
      </a>

      <nav class="header-actions" aria-label="Navegação">
        <a href="/pages/mural.html" class="header-link">Mural</a>
        <a href="/pages/login.html" class="btn btn-primary btn-small">
          Entrar
        </a>
      </nav>
    </header>

    <main class="mural-content">
      <section class="mural-banner">
        <div class="mural-banner-overlay"></div>

        <div class="mural-banner-content">
          <h1>Bem-vindo ao Mural Digital do IFTO</h1>
          <p>Fique por dentro das novidades, eventos e comunicados.</p>
        </div>
      </section>

      <nav class="mural-filters" aria-label="Categorias das publicações">
        <button
          type="button"
          class="mural-filter mural-filter--active"
          data-filtro="todos"
        >
          <i data-lucide="layout-grid"></i>
          Todos
        </button>

        <button type="button" class="mural-filter" data-filtro="noticia">
          <i data-lucide="newspaper"></i>
          Notícias
        </button>

        <button type="button" class="mural-filter" data-filtro="evento">
          <i data-lucide="calendar-days"></i>
          Eventos
        </button>

        <button type="button" class="mural-filter" data-filtro="video">
          <i data-lucide="video"></i>
          Vídeos
        </button>
      </nav>

      <section class="mural-publications" id="publicacoes"></section>
    </main>

    <footer class="footer">IFTO - Mural Digital</footer>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/config.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/mural.js"></script>
  </body>
</html>
